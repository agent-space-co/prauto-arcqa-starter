name: Stale PR Sweep

on:
  schedule:
    - cron: '0 14 * * *'   # 9am CDT (UTC-5) daily
  workflow_dispatch:

permissions:
  pull-requests: write
  issues: write

jobs:
  stale-sweep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const MS_48H = 48 * 60 * 60 * 1000;
            const MS_96H = 96 * 60 * 60 * 1000;
            const STALE_LABEL = 'stale';
            const now = Date.now();

            // Ensure stale label exists
            try {
              await github.rest.issues.createLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: STALE_LABEL,
                color: 'e4e669',
                description: 'PR has been open more than 48 hours without activity',
              });
            } catch (e) {
              // Label already exists - fine
            }

            const { data: prs } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            });

            let labeled = 0;
            let closed = 0;
            let skipped = 0;

            for (const pr of prs) {
              const ageMs = now - new Date(pr.created_at).getTime();
              const hasStale = pr.labels.some(l => l.name === STALE_LABEL);

              if (ageMs < MS_48H) {
                skipped++;
                continue;
              }

              if (ageMs >= MS_96H && hasStale) {
                // Close stale PR
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: pr.number,
                  body: `**Stale PR closed automatically.** This PR was open for more than 96 hours after receiving a stale warning. Re-open and resolve the stale label if the work is still needed.`,
                });
                await github.rest.pulls.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: pr.number,
                  state: 'closed',
                });
                // K.50: create a tracking issue so the dropped work is visible
                const prUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/pull/${pr.number}`;
                await github.rest.issues.create({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  title: `stale: PR #${pr.number} closed - "${pr.title}"`,
                  body: `PR #${pr.number} was automatically closed by the stale sweeper after 96 hours of inactivity.\n\n**PR:** [${pr.title}](${prUrl})\n**Branch:** \`${pr.head.ref}\`\n**Author:** @${pr.user.login}\n\nIf this work is still needed, re-open the PR or create a new one. Remove the \`stale\` label to reset the clock on the next attempt.`,
                  labels: ['stale', 'needs-reopen'],
                  assignees: [pr.user.login],
                });
                console.log(`Closed stale PR #${pr.number}: ${pr.title}`);
                closed++;
              } else if (ageMs >= MS_48H && !hasStale) {
                // Add stale label and warn
                await github.rest.issues.addLabels({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: pr.number,
                  labels: [STALE_LABEL],
                });
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: pr.number,
                  body: `**Stale warning:** this PR has been open 48+ hours. It will be closed automatically after 96 hours if not merged or resolved. Remove the \`stale\` label to reset the clock.`,
                });
                console.log(`Labeled stale PR #${pr.number}: ${pr.title}`);
                labeled++;
              }
            }

            console.log(`Stale sweep complete: ${labeled} labeled, ${closed} closed, ${skipped} too young.`);
