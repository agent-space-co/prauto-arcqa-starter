name: WIP Check

on:
  pull_request:
    types: [opened]

permissions:
  contents: read
  pull-requests: write

jobs:
  wip-check:
    runs-on: ubuntu-latest
    steps:
      - name: Enforce WIP cap
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          count=$(gh api "repos/$GITHUB_REPOSITORY/pulls?state=open&per_page=100" --jq 'length')
          if [ "$count" -gt 50 ]; then
            gh api \
              repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments \
              -f body="**WIP cap reached (${count}/50 open PRs).** PRAuto auto-merges tier:1 PRs as required checks pass; stale PRs are auto-closed after 96h. Resolve blocked PRs or close stale ones before opening new work." \
              --method POST
            exit 1
          fi
          echo "WIP: ${count}/50 open PRs — within cap."
