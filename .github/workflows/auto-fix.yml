name: Auto-Fix CI Failures

on:
  workflow_run:
    workflows: ["lint", "Lint Guard"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  ruff-autofix:
    name: Auto-fix ruff violations
    runs-on: ubuntu-latest
    if: >
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.head_branch != 'main'
    steps:
      - name: Get PR for this workflow run
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          pr_number=$(gh pr list \
            --repo "$GITHUB_REPOSITORY" \
            --head "$HEAD_BRANCH" \
            --state open \
            --json number \
            --jq '.[0].number // empty')
          echo "number=${pr_number}" >> "$GITHUB_OUTPUT"
          echo "branch=${HEAD_BRANCH}" >> "$GITHUB_OUTPUT"

      - name: Skip if no open PR
        if: steps.pr.outputs.number == ''
        run: echo "No open PR for ${{ github.event.workflow_run.head_branch }} — skipping." && exit 0

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_branch }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install ruff
        run: pip install ruff

      - name: Run ruff auto-fix
        id: fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          ruff check --fix --unsafe-fixes . || true
          ruff format .
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git add -u
            git commit -m "chore: auto-fix ruff violations"
          fi

      - name: Push fix
        if: steps.fix.outputs.changed == 'true'
        run: git push origin HEAD:${{ steps.pr.outputs.branch }}

      - name: Comment — fix applied
        if: steps.fix.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          gh issue comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" \
            --body "**Auto-fix applied:** ruff violations corrected and pushed. CI will re-run."

      - name: Comment — nothing to fix
        if: steps.fix.outputs.changed == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          gh issue comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" \
            --body "**Lint failed but ruff found nothing to auto-fix.** Manual attention required. [CI run]($RUN_URL)"

  conflict-detect:
    name: Detect merge conflicts
    runs-on: ubuntu-latest
    if: >
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.head_branch != 'main'
    steps:
      - name: Get PR info
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          pr_json=$(gh pr list \
            --repo "$GITHUB_REPOSITORY" \
            --head "$HEAD_BRANCH" \
            --state open \
            --json number,mergeable,title,user \
            --jq '.[0] // empty')
          echo "number=$(echo "$pr_json" | jq -r '.number // empty')" >> "$GITHUB_OUTPUT"
          echo "mergeable=$(echo "$pr_json" | jq -r '.mergeable // empty')" >> "$GITHUB_OUTPUT"
          echo "title=$(echo "$pr_json" | jq -r '.title // empty')" >> "$GITHUB_OUTPUT"
          echo "author=$(echo "$pr_json" | jq -r '.user.login // empty')" >> "$GITHUB_OUTPUT"
          echo "branch=${HEAD_BRANCH}" >> "$GITHUB_OUTPUT"

      - name: Skip if no conflict
        if: steps.pr.outputs.number == '' || steps.pr.outputs.mergeable != 'CONFLICTING'
        run: echo "No conflict detected — skipping."

      - uses: actions/checkout@v4
        if: steps.pr.outputs.mergeable == 'CONFLICTING'
        with:
          ref: ${{ steps.pr.outputs.branch }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Attempt auto-rebase
        id: rebase
        if: steps.pr.outputs.mergeable == 'CONFLICTING'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          if git rebase origin/main; then
            echo "success=true" >> "$GITHUB_OUTPUT"
          else
            git rebase --abort || true
            echo "success=false" >> "$GITHUB_OUTPUT"
            echo "conflict_files<<EOF" >> "$GITHUB_OUTPUT"
            git diff --name-only --diff-filter=U 2>/dev/null || echo "(unable to list)"
            echo "EOF" >> "$GITHUB_OUTPUT"
          fi

      - name: Push resolved rebase
        if: steps.pr.outputs.mergeable == 'CONFLICTING' && steps.rebase.outputs.success == 'true'
        run: git push origin HEAD:${{ steps.pr.outputs.branch }} --force-with-lease

      - name: Comment — rebase succeeded
        if: steps.pr.outputs.mergeable == 'CONFLICTING' && steps.rebase.outputs.success == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          gh issue comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" \
            --body "**Merge conflict auto-resolved:** rebased onto \`main\` and force-pushed. CI will re-run."

      - name: Create issue — rebase failed
        if: steps.pr.outputs.mergeable == 'CONFLICTING' && steps.rebase.outputs.success == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          PR_TITLE: ${{ steps.pr.outputs.title }}
          PR_AUTHOR: ${{ steps.pr.outputs.author }}
          PR_BRANCH: ${{ steps.pr.outputs.branch }}
          CONFLICT_FILES: ${{ steps.rebase.outputs.conflict_files }}
        run: |
          gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "merge-conflict: PR #$PR_NUMBER cannot auto-rebase" \
            --body "PR #$PR_NUMBER has conflicts that could not be resolved automatically.

**PR:** https://github.com/$GITHUB_REPOSITORY/pull/$PR_NUMBER
**Branch:** \`$PR_BRANCH\`

**Conflicting files:**
\`\`\`
$CONFLICT_FILES
\`\`\`

Resolve manually:
\`\`\`bash
git checkout $PR_BRANCH
git fetch origin main
git rebase origin/main
git add .
git rebase --continue
git push --force-with-lease
\`\`\`" \
            --label "merge-conflict" \
            --assignee "$PR_AUTHOR" || true
          gh issue comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" \
            --body "**Merge conflict detected:** auto-rebase failed. A tracking issue has been created." || true
