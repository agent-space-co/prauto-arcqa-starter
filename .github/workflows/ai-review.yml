name: AI PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number'
        required: true
      pr_title:
        description: 'PR title'
        required: false
        default: ''

permissions:
  pull-requests: write
  contents: write

jobs:
  ai-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: AI Review via Claude
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.inputs.pr_number || github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.inputs.pr_title || github.event.pull_request.title }}
        run: |
          python3 - <<'PYEOF'
          import os, json, subprocess, sys, urllib.request

          pr_number = os.environ["PR_NUMBER"]
          pr_title  = os.environ["PR_TITLE"]
          anthropic_key  = os.environ.get("ANTHROPIC_API_KEY", "")
          discord_webhook = os.environ.get("DISCORD_WEBHOOK", "")
          repo     = os.environ.get("GITHUB_REPOSITORY", "")
          gh_token = os.environ["GH_TOKEN"]

          result = subprocess.run(
              ["gh","api","-H","Accept: application/vnd.github.diff",
               f"repos/{repo}/pulls/{pr_number}"],
              capture_output=True, text=True)
          diff = result.stdout or ""
          diff_lines = len(diff.splitlines())
          diff_truncated = diff[:8000] + ("\n... [truncated]" if len(diff) > 8000 else "")

          prompt = f"""You are a code reviewer. Review this PR diff and return JSON only — no markdown, no prose.

PR Title: {pr_title}
Diff line count: {diff_lines}

Diff:
```
{diff_truncated}
```

Auto-flag as "request_changes" if added lines contain:
- Hardcoded credentials, API keys, or secrets
- eval(), exec(), subprocess with shell=True, pickle.loads()
- SQL string concatenation (non-parameterized queries)
- 0.0.0.0 binding without an explanatory comment
- bare except: pass with no logging

Auto-flag as "needs_human" if:
- Diff touches auth middleware, JWT validation, or RLS policies
- Diff line count exceeds 400
- Diff modifies DB migrations AND application logic in the same PR

Return exactly:
{{"verdict": "approve|request_changes|needs_human", "findings": [], "summary": "one sentence"}}"""

          verdict = "needs_human"
          findings = []
          summary = "AI review failed — routing to human."

          if not anthropic_key:
              summary = "ANTHROPIC_API_KEY not set — routing to human review."
          else:
              payload = json.dumps({
                  "model": "claude-haiku-4-5-20251001",
                  "max_tokens": 1024,
                  "messages": [{"role": "user", "content": prompt}]
              }).encode()
              req = urllib.request.Request(
                  "https://api.anthropic.com/v1/messages", data=payload,
                  headers={"x-api-key": anthropic_key,
                           "anthropic-version": "2023-06-01",
                           "content-type": "application/json"},
                  method="POST")
              try:
                  with urllib.request.urlopen(req, timeout=60) as resp:
                      body = json.loads(resp.read())
                  raw = body["content"][0]["text"].strip().strip("```").strip()
                  if raw.startswith("json"): raw = raw[4:]
                  parsed  = json.loads(raw)
                  verdict = parsed.get("verdict", "needs_human")
                  findings = parsed.get("findings", [])
                  summary = parsed.get("summary", "")
              except Exception as e:
                  print(f"Claude API error: {e}", file=sys.stderr)
                  verdict = "needs_human"
                  summary = f"AI review error ({type(e).__name__}) — routing to human."

          def post_comment(text):
              payload = json.dumps({"body": text}).encode()
              req = urllib.request.Request(
                  f"https://api.github.com/repos/{repo}/issues/{pr_number}/comments",
                  data=payload,
                  headers={"Authorization": f"Bearer {gh_token}",
                           "Accept": "application/vnd.github+json",
                           "Content-Type": "application/json"},
                  method="POST")
              urllib.request.urlopen(req)

          if verdict == "approve":
              post_comment(f"**AI review passed** — queuing auto-merge.\n\n{summary}")
              subprocess.run([
                  "gh","pr","merge","--auto","--squash","--delete-branch",
                  "--subject", f"auto-merge: {pr_title}", "-R", repo, pr_number,
              ], check=False)
              print("Verdict: approve — auto-merge queued.")
              sys.exit(0)

          elif verdict == "request_changes":
              findings_md = "\n".join(f"- {f}" for f in findings) or "- (see summary)"
              post_comment(f"**AI review: changes requested**\n\n{summary}\n\n**Findings:**\n{findings_md}")
              print("Verdict: request_changes.")
              sys.exit(1)

          else:
              comment = f"**AI review: human review required**\n\n{summary}"
              if findings:
                  comment += "\n\n**Notes:**\n" + "\n".join(f"- {f}" for f in findings)
              post_comment(comment)
              if discord_webhook:
                  pr_url = f"https://github.com/{repo}/pull/{pr_number}"
                  dreq = urllib.request.Request(
                      discord_webhook,
                      data=json.dumps({"content": f"PR needs human review: **{pr_title}**\n{pr_url}\n_{summary}_"}).encode(),
                      headers={"Content-Type": "application/json"}, method="POST")
                  try: urllib.request.urlopen(dreq)
                  except Exception as e: print(f"Discord error: {e}", file=sys.stderr)
              print("Verdict: needs_human — escalated; check passes.")
              sys.exit(0)
          PYEOF
