name: e2e

on:
  pull_request:
    paths:
      - 'surface/**'
      - '.github/workflows/e2e.yml'

permissions:
  contents: read
  issues: write

jobs:
  smoke:
    name: Playwright smoke tests (Surface)
    runs-on: ubuntu-latest
    # QA.A0: report only - does not block merges until QA.A1
    continue-on-error: true

    defaults:
      run:
        working-directory: surface

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: surface/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build Surface app
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

      - name: Start Surface app
        run: npm start &
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

      - name: Wait for server
        run: npx wait-on http://localhost:3000 --timeout 60000

      - name: Run smoke tests
        id: playwright
        run: npx playwright test --reporter=json,html
        env:
          BASE_URL: http://localhost:3000
          CI: true
          E2E_SUPABASE_TOKEN: ${{ secrets.E2E_SUPABASE_TOKEN }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: surface/test-results/
          retention-days: 14

      - name: Report failures as GitHub issues (QA.A5)
        if: failure() && github.event.pull_request.number != ''
        working-directory: ${{ github.workspace }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          BRANCH: ${{ github.head_ref }}
          RUN_ID: ${{ github.run_id }}
        run: |
          python3 scripts/qa_issue_reporter.py \
            --results surface/test-results/results.json \
            --pr-number "$PR_NUMBER" \
            --pr-title "$PR_TITLE" \
            --pr-author "$PR_AUTHOR" \
            --branch "$BRANCH" \
            --run-url "https://github.com/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" \
            --repo "$GITHUB_REPOSITORY" || true
